name: Build Android APK

# Se déclenche : à chaque envoi sur main, à chaque tag "v*" (ex. v1.0.0 → crée aussi une Release
# avec l'APK joint), et manuellement depuis l'onglet Actions ("Run workflow").
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write   # nécessaire pour que le workflow puisse créer/mettre à jour une Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser automatiquement le ZIP du jeu, si tu en as importé un tel quel (ex. NEBUSTION_complet.zip)
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "Aucun .zip à la racine du dépôt : le projet est déjà décompressé (fichiers déjà à plat), rien à faire."
            exit 0
          fi
          echo "ZIP détecté : $ZIP → décompression automatique"
          rm -rf _zip_extract
          mkdir _zip_extract
          unzip -q -o "$ZIP" -d _zip_extract
          # Si tout le contenu est dans un seul dossier à l'intérieur du zip (ex. "nebustion/"), on le remonte
          # à la racine, pour que index.html, js/, package.json... se retrouvent directement au bon endroit.
          ENTRIES=$(ls -A _zip_extract)
          if [ "$(echo "$ENTRIES" | wc -l)" = "1" ] && [ -d "_zip_extract/$ENTRIES" ]; then
            SRC="_zip_extract/$ENTRIES"
          else
            SRC="_zip_extract"
          fi
          cp -rf "$SRC"/. .
          rm -rf _zip_extract
          echo "Contenu du zip placé à la racine du projet."

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer le JDK (nécessaire à Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances (Capacitor)
        run: npm install

      - name: Préparer les fichiers web (www/)
        run: npm run www:build

      - name: Ajouter la plateforme Android (générée à chaque exécution, non versionnée)
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Autoriser l'exécution de gradlew
        run: chmod +x android/gradlew

      - name: Construire l'APK (debug — installable directement, non signé pour le Play Store)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK comme fichier téléchargeable du run (zippé par GitHub — voir la Release ci-dessous pour un lien direct sans dézipper)
        uses: actions/upload-artifact@v4
        with:
          name: nebustion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier/mettre à jour la Release "latest" (lien direct vers l'APK, jamais zippé)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Dernière version (APK)
          body: APK reconstruit automatiquement à chaque envoi sur main. Télécharge `app-debug.apk` ci-dessous — pas besoin de dézipper.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Créer une Release versionnée avec l'APK (uniquement sur un tag "v*")
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
